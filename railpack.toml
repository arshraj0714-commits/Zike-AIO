# =============================================================
#  Railpack 0.33+ config · Zike Bot + Dashboard (single service)
# =============================================================
#  Railway's default builder is now Railpack, which reads this
#  file (railpack.toml) — NOT nixpacks.toml.
#
#  Builds both:
#    • Python 3.11 bot (bot/Zike.py) + embedded FastAPI
#    • Node 20 Next.js dashboard (dashboard/)
#  And launches both via start.sh in a single service.
# =============================================================

# --- Start command -------------------------------------------
#  bash start.sh boots the bot + dashboard together.
#  (start.sh MUST be committed to the repo root — see the file
#   tree printed by Railpack to verify it's there.)
[start]
  cmd = "bash start.sh"

# --- Setup phase: extra Nix packages -------------------------
#  Python and Node themselves are auto-detected by Railpack
#  from bot/requirements.txt and dashboard/package.json.
#  We only add the system-level deps Railpack wouldn't know about.
[[phases.setup]]
  nixPkgs = [
    "ffmpeg",            # discord voice / wavelink playback
    "openssl",           # next-auth JWT signing
    "libffi",            # cffi / cryptography wheels
    "fontconfig",        # PIL font discovery
    "noto-fonts-cjk",    # CJK glyphs for welcome-card images
  ]

# --- Install phase: both Python and Node deps ----------------
[[phases.install]]
  cmds = [
    # Python venv + bot deps
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip setuptools wheel",
    "/opt/venv/bin/pip install -r bot/requirements.txt",
    # Dashboard deps (--legacy-peer-deps avoids Radix/React peer conflicts)
    "cd dashboard && npm install --legacy-peer-deps",
  ]

# --- Build phase: Next.js production build -------------------
[[phases.build]]
  cmds = [
    "cd dashboard && npm run build",
  ]

# =============================================================
#  Required Railway env vars (Railway → Variables):
# -------------------------------------------------------------
#  TOKEN                  → Discord bot token
#  OWNER_IDS              → comma-separated Discord user IDs
#  MONGO_URI              → mongodb+srv://...
#  API_KEY                → shared secret the dashboard sends
#  LOG_CHANNEL_ID, SERVER_COUNT_CHANNEL_ID, USER_COUNT_CHANNEL_ID
#
#  Dashboard / auth:
#  NEXTAUTH_URL           → https://<your-railway-service-url>
#  NEXTAUTH_SECRET        → openssl rand -base64 32
#  DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
#  NEXT_PUBLIC_API_URL    → https://<cloudflared-tunnel-url>/api/v1
#                           (printed by the bot on first boot)
#  NEXT_PUBLIC_BRAND_NAME → Zike
#
#  PORT is injected by Railway automatically.
#  API_PORT defaults to 8000 inside start.sh.
# =============================================================
