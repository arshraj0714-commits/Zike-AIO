# =============================================================
#  Vercel deployment config  ·  Zike Dashboard (Next.js)
# =============================================================
#  This file deploys ONLY the Next.js dashboard (dashboard/).
#  The Python bot + FastAPI backend is a long-running process
#  and must be hosted separately (Railway, Render, Fly.io, VPS).
#  Use nixpacks.toml for the bot backend.
# =============================================================

# --- Project / framework --------------------------------------
[build]
  framework   = "nextjs"
  rootDirectory = "dashboard"
  command      = "npm install && npm run build"
  outputDirectory = ".next"

# --- Runtime --------------------------------------------------
# Vercel manages Node automatically; pin override only if needed.
[build.environment]
  NODE_VERSION       = "20"
  NPM_FLAGS          = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# --- Headers (security + caching) -----------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Rewrites -------------------------------------------------
#  Everything falls through to Next.js's router. API calls go to
#  the bot backend via the NEXT_PUBLIC_API_URL env var (set in the
#  Vercel dashboard), so no proxy rewrite is needed here.
[[rewrites]]
  source = "/((?!api/v1).*)"
  destination = "/$1"

# --- Notes on required env vars (set in Vercel project UI) ----
#  NEXT_PUBLIC_API_URL      → https://<bot-host>/api/v1
#  NEXT_PUBLIC_BRAND_NAME   → Zike
#  NEXTAUTH_URL             → https://<your-vercel-domain>
#  NEXTAUTH_SECRET          → <openssl rand -base64 32>
#  DISCORD_CLIENT_ID        → <discord oauth2 client id>
#  DISCORD_CLIENT_SECRET    → <discord oauth2 client secret>
